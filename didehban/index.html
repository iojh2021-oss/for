<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Interactive 3D telecom city: from laptop to data center, with a radio-link lab. شبیه‌ساز تعاملی شبکه‌ی مخابرات.">
  <title>شهر مخابراتی تهران · Mokhaberat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
/* Mokhaberat — styles. Logical properties are used so one stylesheet serves RTL (fa) and LTR (en). */
:root {
  --sky-top: #D5E2F1; --sky-bot: #F6EFE0;
  --ink: #16223B; --ink-2: #4A5A78; --paper: #FBF8F1; --line: #D9D0BC;
  --signal: #E8602C; --signal-ink: #B8420F; --fiber: #0F7C8A; --focus: #2B5FD9;
  --lab-bg: #0D1829; --lab-panel: #152339; --lab-line: #28405F; --lab-txt: #DCE6F5; --lab-dim: #8FA4C4;
  --amber: #F2B84B; --mint: #5FD3C9; --coral: #FF8A5C;
  font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); background: linear-gradient(180deg, var(--sky-top), var(--sky-bot)); font-size: 15px; line-height: 1.7; }
body.lab-open #stage, body.lab-open #labels { visibility: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.pin {
  position: absolute; top: 0; left: 0; pointer-events: auto;
  background: var(--paper); border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 2px 0 rgba(22,34,59,.85); transition: background .15s, color .15s;
}
.pin::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 8px; background: var(--ink); translate: -50% 0; }
.pin.hot { background: #fff; border-color: var(--signal); }
.pin.dim { opacity: .28; }
.pin.sel { background: var(--signal); color: #fff; border-color: var(--signal-ink); }

/* top bar */
.bar { position: fixed; inset-block-start: 0; inset-inline: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 18px; pointer-events: none; }
.bar > * { pointer-events: auto; }
.brand h1 { margin: 0; font-size: clamp(20px, 3.2vw, 30px); font-weight: 800; line-height: 1.2; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; max-width: 34ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.actions button, .panel .wide, .tracebar button {
  border: 1.5px solid var(--ink); background: var(--paper); border-radius: 10px; padding: 6px 14px; font-weight: 700; min-height: 40px;
}
.actions button:hover { background: #fff; }
.actions .primary { background: var(--ink); color: #fff; }
.actions .primary[aria-pressed=true] { background: var(--signal); border-color: var(--signal-ink); }
.actions .signal, .panel .signal { background: var(--signal); color: #fff; border-color: var(--signal-ink); }
.actions .ghost { min-width: 40px; }
.hint { position: fixed; inset-block-end: 70px; inset-inline-start: 18px; margin: 0; font-size: 12px; color: var(--ink-2); pointer-events: none; max-width: 36ch; }

/* unit chips */
.chips { position: fixed; inset-inline: 0; inset-block-end: 0; display: flex; gap: 8px; padding: 10px 18px calc(12px + env(safe-area-inset-bottom)); overflow-x: auto; scrollbar-width: thin; }
.chip { flex: none; border: 1.5px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 4px 14px; font-size: 13px; font-weight: 600; min-height: 36px; white-space: nowrap; }
.chip:hover { background: #fff; }
.chip[aria-pressed=true] { background: var(--ink); color: #fff; }

/* packet tracer */
.tracebar { position: fixed; inset-inline: 18px; inset-block-start: 74px; margin-inline: auto; max-width: 640px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(22,34,59,.25); }
.tracebar .ts { background: var(--signal); border-radius: 999px; padding: 0 10px; font-weight: 800; font-size: 12px; }
.tracebar strong { font-weight: 800; }
.tracebar #traceText { flex: 1 1 260px; color: #DCE6F5; font-size: 14px; }
.tracebar button { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); min-height: 32px; padding: 2px 12px; font-size: 13px; }

/* detail panel */
.panel { position: fixed; inset-block: 74px 62px; inset-inline-end: 16px; width: min(400px, calc(100vw - 32px)); overflow-y: auto; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; padding: 18px 18px 22px; box-shadow: 0 10px 0 rgba(22,34,59,.12), 0 18px 40px rgba(22,34,59,.18); }
.panel .x { position: absolute; inset-block-start: 10px; inset-inline-start: 10px; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--ink); background: #fff; font-size: 20px; line-height: 1; }
.panel .cat { margin: 0 0 2px; color: var(--signal-ink); font-weight: 700; font-size: 13px; padding-inline-start: 40px; }
.panel h2 { margin: 0 0 12px; font-size: 20px; line-height: 1.4; font-weight: 800; }
.panel h3 { margin: 18px 0 6px; font-size: 14px; font-weight: 800; color: var(--fiber); }
.anim { margin: 0; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: #F3EEE2; }
.anim canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.anim figcaption { padding: 4px 10px 6px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); }
.desc { margin: 0; }
dl { margin: 0; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.5fr); gap: 0; font-size: 13.5px; }
dt, dd { margin: 0; padding: 6px 0; border-top: 1px solid var(--line); }
dt { font-weight: 700; padding-inline-end: 10px; }
dd { text-align: start; }
ul { margin: 0; padding-inline-start: 20px; font-size: 13.5px; }
.fine { font-size: 12px; color: var(--ink-2); margin: 8px 0 0; }
.panel .wide { width: 100%; margin-top: 14px; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, var(--sky-top), var(--sky-bot)); font-weight: 700; font-size: 18px; padding: 24px; text-align: center; }
.loading.err { color: #9B2C0F; }

/* ---------- radio lab ---------- */
.lab { position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 26, .86); display: grid; place-items: center; padding: 14px; }
.lab-shell { width: min(1180px, 100%); max-height: 100%; overflow-y: auto; background: var(--lab-bg); color: var(--lab-txt); border: 1.5px solid var(--lab-line); border-radius: 16px; display: flex; flex-direction: column; }
.lab-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 10px; border-bottom: 1px solid var(--lab-line); }
.lab-head h2 { margin: 0; font-size: 22px; font-weight: 800; }
.lab-head p { margin: 0; color: var(--lab-dim); font-size: 13px; }
.lab-close { border: 1.5px solid var(--lab-dim); background: transparent; color: var(--lab-txt); border-radius: 10px; padding: 4px 16px; min-height: 38px; font-weight: 700; }
.lab-body { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; padding: 16px 20px; }
.rack { background: var(--lab-panel); border: 1px solid var(--lab-line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.grp h3 { margin: 0 0 6px; font-size: 12.5px; font-weight: 700; color: var(--lab-dim); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.sb { border: 1.5px solid var(--lab-line); background: #0F1C31; color: var(--lab-txt); border-radius: 8px; padding: 2px 10px; min-height: 34px; font-size: 13px; font-weight: 600; }
.sb[aria-pressed=true] { background: var(--amber); color: #1B1405; border-color: var(--amber); }
.knobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 6px; }
.knob { display: grid; justify-items: center; gap: 2px; text-align: center; border-radius: 10px; padding: 4px 0; }
.dial { --a: 0deg; width: 54px; height: 54px; border-radius: 50%; position: relative; cursor: ns-resize;
  background: radial-gradient(circle at 35% 30%, #4A5E7D, #1B2B44 62%, #0C1626); border: 2px solid #3A5276; box-shadow: 0 3px 0 #060B14, inset 0 0 0 4px #14233A; }
.dial i { position: absolute; inset: 0; rotate: var(--a); }
.dial i::after { content: ''; position: absolute; inset-inline-start: 50%; inset-block-start: 5px; width: 4px; height: 15px; margin-inline-start: -2px; border-radius: 2px; background: var(--amber); }
.kl { font-size: 11.5px; color: var(--lab-dim); line-height: 1.3; }
.kv { font-size: 12.5px; font-weight: 700; color: var(--mint); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
#msgIn { width: 100%; background: #07101E; color: var(--amber); border: 1.5px solid var(--lab-line); border-radius: 8px; padding: 6px 10px; font: inherit; font-weight: 600; }

.screens { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
.screen { margin: 0; background: #07101E; border: 1.5px solid var(--lab-line); border-radius: 10px; overflow: hidden; }
.screen.wide { grid-column: 1 / -1; }
.screen figcaption { font-size: 12px; font-weight: 700; color: var(--lab-dim); padding: 4px 10px; border-bottom: 1px solid var(--lab-line); }
.screen canvas { display: block; width: 100%; height: 150px; }
.screen.wide canvas { height: 176px; }

.lab-foot { padding: 4px 20px 16px; display: grid; gap: 10px; }
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.cell { background: #07101E; border: 1px solid var(--lab-line); border-radius: 8px; padding: 4px 10px 6px; display: grid; grid-template-columns: 1fr auto; align-items: baseline; }
.cl { grid-column: 1 / -1; font-size: 11.5px; color: var(--lab-dim); }
.cv { font-size: 20px; font-weight: 800; color: var(--amber); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.cu { font-size: 11px; color: var(--lab-dim); direction: ltr; padding-inline-start: 6px; }
.rxline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14px; }
.led { width: 14px; height: 14px; border-radius: 50%; background: #444; box-shadow: 0 0 0 2px #0a0f18; }
.led[data-s="2"] { background: #3DDC84; box-shadow: 0 0 10px #3DDC84; }
.led[data-s="1"] { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.led[data-s="0"] { background: #FF5A4F; box-shadow: 0 0 10px #FF5A4F; }
.msgs { color: var(--lab-txt); unicode-bidi: plaintext; }
.note { margin: 0; font-size: 12px; color: var(--lab-dim); }

@media (max-width: 860px) {
  .lab-body { grid-template-columns: 1fr; }
  .knobs { grid-template-columns: repeat(4, 1fr); }
  .screens { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .bar { flex-direction: column; padding: 10px 12px; }
  .brand p, .hint { display: none; }
  .actions { justify-content: flex-start; }
  .actions button { min-height: 38px; padding: 4px 10px; font-size: 13px; }
  .panel { inset-block: auto 0; inset-inline: 0; width: auto; max-height: 64vh; border-radius: 16px 16px 0 0; border-inline-width: 0; border-block-end-width: 0; }
  body:has(.panel:not([hidden])) .chips { display: none; }
  .tracebar { inset-block-start: 110px; inset-inline: 10px; }
  .lab { padding: 0; }
  .lab-shell { border-radius: 0; height: 100%; }
  .knobs { gap: 8px 2px; }
  .dial { width: 46px; height: 46px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- power additions ---------- */
.actions .power { background: #E0A100; color: #1B1405; border-color: #8A6200; }
.actions .power[aria-pressed=true] { background: var(--signal); color: #fff; border-color: var(--signal-ink); }
.chip.pw { border-color: #8A6200; background: #FFF4D2; }
.chip.pw[aria-pressed=true] { background: #E0A100; color: #1B1405; }
.layerbar { max-width: 460px; justify-content: space-between; inset-block-start: 74px; }
.facts { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.facts li { border-inline-start: 3px solid #E0A100; padding: 4px 10px; margin: 0 0 6px; background: #FFF9E6; border-radius: 4px; }
.facts small { color: var(--ink-2); }
.calc { border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; }
.calc-title { margin: 0 0 6px; font-weight: 800; }
.crow { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin-bottom: 6px; font-size: 13px; }
.crow output { font-weight: 700; direction: ltr; unicode-bidi: isolate; }
.crow input { grid-column: 1 / -1; width: 100%; accent-color: var(--signal); }
.cres { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 6px; }
.cres div { background: #17233A; color: #fff; border-radius: 8px; padding: 4px 10px; display: grid; }
.cres span { font-size: 11.5px; color: #BBD3EC; }
.cres strong { font-size: 18px; color: #FFD23F; direction: ltr; unicode-bidi: isolate; text-align: start; }

/* ---------- report modal ---------- */
.report { position: fixed; inset: 0; z-index: 25; background: rgba(22, 34, 59, .55); display: grid; place-items: center; padding: 14px; }
.report-shell { width: min(820px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; }
.report-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; background: var(--paper); border-bottom: 1.5px solid var(--line); }
.report-head h2 { margin: 0; font-size: 20px; font-weight: 800; }
.report-close { border: 1.5px solid var(--ink); background: #fff; border-radius: 10px; padding: 4px 16px; min-height: 38px; font-weight: 700; }
.report-body { padding: 8px 18px 22px; }
.report-body h3 { margin: 18px 0 6px; font-size: 15px; color: var(--fiber); font-weight: 800; }
.report-body .lead { margin: 10px 0 0; }
.rlayer { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; background: #fff; }
.rlayer p { margin: 2px 0 6px; font-size: 14px; }
.rlayer button { border: 1.5px solid var(--ink); background: var(--paper); border-radius: 8px; padding: 2px 12px; min-height: 32px; font-weight: 700; margin-top: 6px; }
.rrow { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: #E8EEF7; border-radius: 999px; padding: 0 10px; font-size: 12.5px; }
.srcs { padding-inline-start: 22px; font-size: 13.5px; }
.srcs a { color: #1D4FB8; overflow-wrap: anywhere; }

  </style>
</head>
<body>
  <canvas id="stage" aria-label="3D city"></canvas>
  <div id="labels"></div>

  <header class="bar">
    <div class="brand">
      <h1 data-i18n="title">شهر مخابراتی تهران</h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="actions">
      <button type="button" id="btnHome" class="ghost" data-i18n-label="units" aria-label="Home">⌂</button>
      <button type="button" id="btnTrace" class="primary" aria-pressed="false" data-i18n="trace"></button>
      <button type="button" id="btnTracePower" class="power" aria-pressed="false" data-i18n="tracePower"></button>
      <button type="button" id="btnReport" class="ghost" data-i18n="report"></button>
      <button type="button" id="btnRadio" class="signal" data-i18n="radio"></button>
      <button type="button" id="btnLang" class="ghost" lang="en">English</button>
    </div>
  </header>

  <p class="hint" data-i18n="hint"></p>

  <div id="traceBar" class="tracebar" role="status" aria-live="polite" hidden>
    <span id="traceStep" class="ts"></span>
    <strong id="traceUnit"></strong>
    <span id="traceText"></span>
    <button type="button" id="traceStop" data-i18n="traceStop"></button>
  </div>

  <div id="layerBar" class="tracebar layerbar" hidden><strong id="layerName"></strong><button type="button" id="layerClear" data-i18n="clearHl"></button></div>

  <nav id="chips" class="chips" aria-label="units"></nav>

  <aside id="panel" class="panel" hidden aria-live="polite">
    <button type="button" id="pClose" class="x" data-i18n-label="close" aria-label="Close">×</button>
    <p id="pCat" class="cat"></p>
    <h2 id="pName"></h2>
    <figure class="anim">
      <canvas id="pCanvas" width="480" height="270"></canvas>
      <figcaption id="pAnimCap"></figcaption>
    </figure>
    <h3 data-i18n="function"></h3>
    <p id="pDesc" class="desc"></p>
    <div id="pCalcWrap" hidden><h3 data-i18n="calc"></h3><div id="pCalc" class="calc"></div></div>
    <h3 data-i18n="specs"></h3>
    <dl id="pSpecs"></dl>
    <div id="pFactsWrap" hidden><h3 data-i18n="tehranFacts"></h3><ul id="pFacts" class="facts"></ul></div>
    <h3 data-i18n="models"></h3>
    <ul id="pModels"></ul>
    <p class="fine" data-i18n="modelsNote"></p>
    <button type="button" id="btnOpenRadio" class="signal wide" data-i18n="openRadio" hidden></button>
    <p class="fine" data-i18n="eduNote"></p>
  </aside>

  <section id="report" class="report" hidden></section>
  <section id="lab" class="lab" hidden></section>
  <div id="loading" class="loading" data-i18n="loading">در حال ساخت شهر…</div>

  <script>

  <script>
/* radio-core.js — pure signal-processing & link-budget math (no DOM).
 *
 * Model summary
 *  - Link budget:  Pr = Pt + Gt + Gr − FSPL − extra ;  N = −174 dBm/Hz + 10·log10(B) + NF ;  SNR = Pr − N
 *  - FSPL (dB)  =  32.44 + 20·log10(d_km) + 20·log10(f_MHz)
 *  - Digital: symbol rate Rs = B (ideal Nyquist), so Es/N0 = SNR and Eb/N0 = SNR / bits-per-symbol.
 *  - Symbols are Gray-mapped (BPSK, QPSK, 16-QAM), unit average symbol energy, AWGN (+ optional
 *    flat Rayleigh fading with perfect channel knowledge). BER is both computed (theory) and measured (Monte-Carlo).
 *  - Scope/spectrum use a passband waveform at a scaled carrier (1/16 of the sample rate); the frequency
 *    axis in the UI is rescaled to real MHz from the chosen bandwidth.
 */
(function (root) {
  'use strict';
  const TAU = 2 * Math.PI;
  const log10 = (x) => Math.log(x) / Math.LN10;

  // Complementary error function (Numerical Recipes erfcc, |err| < 1.2e-7 relative)
  function erfc(x) {
    const z = Math.abs(x), t = 1 / (1 + 0.5 * z);
    const r = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 +
      t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 +
      t * (-0.82215223 + t * 0.17087277)))))))));
    return x >= 0 ? r : 2 - r;
  }

  const SYM_LEN = 64;      // samples per symbol (digital)
  const CAR_PER = 16;      // samples per carrier cycle
  const NS = 4096;         // samples in one capture
  const MODS = {
    BPSK:  { digital: true,  bps: 1 },
    QPSK:  { digital: true,  bps: 2 },
    QAM16: { digital: true,  bps: 4 },
    AM:    { digital: false, bFactor: 64 },   // simulated RF bandwidth = fs / bFactor
    FM:    { digital: false, bFactor: 25 }
  };
  const FM_DEV = 0.012;    // peak deviation, cycles/sample
  const AM_INDEX = 0.7;

  const dbToLin = (db) => Math.pow(10, db / 10);
  const linToDb = (x) => 10 * log10(x);

  function fspl(dKm, fMHz) { return 32.44 + 20 * log10(dKm) + 20 * log10(fMHz); }
  function noiseDbm(bMHz, nfDb) { return -174 + 10 * log10(bMHz * 1e6) + nfDb; }
  function linkBudget(p) {
    const loss = fspl(p.dKm, p.fMHz);
    const prx = p.ptDbm + p.gtDbi + p.grDbi - loss - p.extraDb;
    const noise = noiseDbm(p.bMHz, p.nfDb);
    return { fspl: loss, prx: prx, noise: noise, snr: prx - noise };

  // ---------- theory ----------
  function berAwgn(mod, ebn0) {
    if (mod === 'BPSK' || mod === 'QPSK') return 0.5 * erfc(Math.sqrt(ebn0));
    if (mod === 'QAM16') return 0.375 * erfc(Math.sqrt(0.4 * ebn0));

  function berRayleigh(mod, ebn0Mean) {

    return sum;

  function berTheory(mod, ebn0, fading) { return fading ? berRayleigh(mod, ebn0) : berAwgn(mod, ebn0); }

  // ---------- randomness ----------
  function gauss() {
    let u = 0; while (u === 0) u = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random());

  function prbs(n, seed) {              // x^15 + x^14 + 1
    const out = new Uint8Array(n); let s = (seed || 0x1ACE) & 0x7FFF; if (!s) s = 1;
    for (let i = 0; i < n; i++) { const b = ((s >> 14) ^ (s >> 13)) & 1; s = ((s << 1) | b) & 0x7FFF; out[i] = b; }

  // ---------- text <-> bits ----------
  function textToBits(str, maxBytes) {

    const bytes = enc.encode(s), bits = new Uint8Array(bytes.length * 8);

    const bps = MODS[mod].bps;
    for (let k = 0; k < n; k++) {

      else if (mod === 'QPSK') { out[b] = yi[k] < 0 ? 1 : 0; out[b + 1] = yq[k] < 0 ? 1 : 0; }

  function simulateSymbols(mod, I, Q, n, esn0, fading) {
    const sig = Math.sqrt(1 / (2 * esn0)), yi = new Float64Array(n), yq = new Float64Array(n);
    for (let k = 0; k < n; k++) {

  function addFlow(path, color, _d, speed, size) {

  // ---------- camera ----------
  const cam = { theta: 0.72, phi: 1.0, r: 84, target: V(7, 1, 0), gTarget: V(7, 1, 0), gR: 84, ix: 0, iy: 0, gix: 0, giy: 0 };
  function updateCamera(dt) {
    const k = 1 - Math.exp(-dt * 5);
    cam.target.lerp(cam.gTarget, k); cam.r += (cam.gR - cam.r) * k;
    const s = Math.sin(cam.phi);
    camera.position.set(cam.target.x + cam.r * s * Math.sin(cam.theta), cam.target.y + cam.r * Math.cos(cam.phi), cam.target.z + cam.r * s * Math.cos(cam.theta));
    camera.lookAt(cam.target); camera.updateMatrixWorld();
    cam.ix += (cam.gix - cam.ix) * k; cam.iy += (cam.giy - cam.iy) * k;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w && h && (Math.abs(cam.ix) > 1e-3 || Math.abs(cam.iy) > 1e-3)) camera.setViewOffset(w, h, -cam.ix * w, cam.iy * h, w, h);
    else if (camera.view && camera.view.enabled) camera.clearViewOffset();
  }
  function bindInput() {
    const ptrs = new Map(); let moved = 0, downAt = null, pinch0 = 0, pinchR0 = 0;
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, b: e.button });
      moved = 0; downAt = { x: e.clientX, y: e.clientY };
      if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); pinchR0 = cam.gR; }
    });
    canvas.addEventListener('pointermove', (e) => {
      const p = ptrs.get(e.pointerId);
      if (!p) { hoverPick(e.clientX, e.clientY); return; }
      const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy);
      if (ptrs.size === 2) {
        p.x = e.clientX; p.y = e.clientY; const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinch0 > 0) cam.gR = clamp(pinchR0 * pinch0 / d, 14, 150);
        return;
      }
      p.x = e.clientX; p.y = e.clientY;
      if (p.b === 2 || e.shiftKey) pan(dx, dy);
      else { cam.theta -= dx * 0.006; cam.phi = clamp(cam.phi - dy * 0.005, 0.25, 1.45); }
    });
    const up = (e) => {
      const had = ptrs.delete(e.pointerId);
      if (had && ptrs.size === 0 && moved < 6 && downAt) pick(e.clientX, e.clientY, true);
      pinch0 = 0;
    };
    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); });
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.gR = clamp(cam.gR * Math.exp(e.deltaY * 0.0012), 14, 150); }, { passive: false });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('pointerleave', () => setHover(null));
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function pan(dx, dy) {
    const k = cam.r * 0.0016, fx = -Math.sin(cam.theta), fz = -Math.cos(cam.theta), rx = Math.cos(cam.theta), rz = -Math.sin(cam.theta);
    const mx = (-dx * rx + dy * fx) * k, mz = (-dx * rz + dy * fz) * k;
    cam.gTarget.x = clamp(cam.gTarget.x + mx, -26, 40); cam.gTarget.z = clamp(cam.gTarget.z + mz, -22, 22);
    cam.target.copy(cam.gTarget);
  }

  // ---------- picking ----------
  const ray = { rc: null, v: null };
  function pickAt(cx, cy) {
    const r = canvas.getBoundingClientRect();
    ray.v.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.rc.setFromCamera(ray.v, camera);
    const hits = ray.rc.intersectObjects(pickRoots, true);
    for (const h of hits) { let o = h.object; while (o && !o.userData.unit) o = o.parent; if (o) return o.userData.unit; }
    return null;
  }
  function hoverPick(x, y) { setHover(pickAt(x, y)); }
  function pick(x, y) { const id = pickAt(x, y); if (cbs.onPick) cbs.onPick(id); }
  function setHover(id) {
    if (id === hovered) return; hovered = id; canvas.style.cursor = id ? 'pointer' : 'grab';
    Object.keys(units).forEach((k) => { units[k].pin && units[k].pin.classList.toggle('hot', k === id); });
  }

      labelsEl.appendChild(b); units[id].pin = b;

  function updatePins() {

    });
  }

  // ---------- packet / power trace ----------
  const tr = { on: false, kind: 'net', path: null, steps: [], t: 0, next: 0, mesh: null, glow: null };
  function buildTrace(kind) {
    const y = 0.32, pts = [], marks = [];
    const bridge = (p) => { pts.push(p); };
    function leg(list) { list.forEach((p, i) => { if (pts.length && i === 0 && pts[pts.length - 1].distanceTo(p) < 0.01) return; pts.push(p.clone()); }); }
    const mark = (unit) => marks.push({ unit: unit, at: pts.length - 1 });
    if (kind === 'power') {
      pts.push(V(31, 4, -8)); marks.push({ unit: 'plant', at: 0 });
      leg(powerPaths.ov1); mark('hvsub');
      bridge(V(26.7, 5.2, 4.5)); leg(powerPaths.ov2); mark('distsub');
      bridge(V(17.4, y, 11)); leg(powerPaths.dsEx); mark('exchange');
      bridge(V(6.8, y, -2.5)); leg(powerPaths.exDc); mark('datacenter');
    } else {
      pts.push(V(0.8, 1.2, 12.5)); marks.push({ unit: 'user', at: 0 });
      bridge(V(0, y, 8.6)); leg(P.userCab); bridge(V(-13.4, y, 8.6)); mark('cabinet');
      bridge(V(-14.4, y, 8.6)); leg(P.cabEx); mark('exchange');
      bridge(V(0, y, -3.2)); bridge(V(0, y, -5.3)); bridge(V(-8, y, -5.3)); mark('fiber');
      bridge(V(-13, y, -5.3)); bridge(V(-13, y, -8.7)); mark('datacenter');
      bridge(V(-13.8, y, -8.7)); leg(P.dcIx); mark('ixp');
      bridge(V(-2.2, y, -9.8)); leg(P.ixSat); mark('satellite');
      bridge(V(-18.2, 3.9, -15.6)); bridge(skySat.position.clone().add(V(0, 0.4, 0)));
    }
    return { pts: pts, marks: marks };
  }
  function startTrace(kind) {
    if (tr.on) return;
    kind = kind === 'power' ? 'power' : 'net';
    const d = buildTrace(kind); tr.kind = kind;
    tr.path = new Path(d.pts); tr.steps = d.marks.map((m) => ({ unit: m.unit, u: tr.path.cum[m.at] / tr.path.len }));
    if (!tr.mesh) {
      tr.mesh = new T.Mesh(new T.SphereGeometry(0.55, 14, 10), new T.MeshBasicMaterial({ color: 0xffffff }));
      tr.glow = new T.Mesh(new T.SphereGeometry(0.95, 14, 10), new T.MeshBasicMaterial({ color: COL.orange, transparent: true, opacity: 0.45, depthWrite: false }));
      scene.add(tr.mesh); scene.add(tr.glow);

  }
  function fireStep(i) { tr.next = i + 1; if (cbs.onTraceStep) cbs.onTraceStep(i, tr.steps[i].unit, tr.steps.length, tr.kind); }
  function stopTrace(silent) {

  }
  function updateTrace(dt) {
    if (!tr.on) return;

    const p = tr.path.at(Math.min(tr.t, 1), tr.mesh.position); tr.glow.position.copy(p);
    tr.glow.scale.setScalar(1 + 0.15 * Math.sin(clock.t * 8));

  // ---------- frame loop ----------

  // ---------- public ----------
  const City = {
    init: function (opts) {

      ray.rc = new T.Raycaster(); ray.v = new T.Vector2();
      buildGround(); buildMountains();
      registerUnit('datacenter', buildDatacenter(), 7, 6);
      registerUnit('ixp', buildIxp(), 6.6, 3.8);
      registerUnit('satellite', buildSatellite(), 7, 4.6);
      registerUnit('broadcast', buildBroadcast(), 30.5, 4.4);
      registerUnit('microwave', buildMicrowave(), 13.6, 3.6);
      registerUnit('exchange', buildExchange(), 9.4, 6.3);
      registerUnit('cell', buildCell(), 11.6, 3.8);
      registerUnit('fiber', buildFiberNode(), 3.4, 3.2);
      registerUnit('cabinet', buildCabinet(), 4, 2.4);
      registerUnit('user', buildUser(), 5.2, 4.6);
      registerUnit('plant', buildPlant(), 17.5, 7);
      registerUnit('hvsub', buildHvSub(), 7.4, 5.4);
      registerUnit('distsub', buildDistSub(), 6.4, 3.9);
      registerUnit('solar', buildSolar(), 9.6, 5.8);

      selected = id;
      if (id && units[id]) {
        if (units[id].pin) units[id].pin.classList.add('sel');
        if (focus) { const a = units[id].group.position; cam.gTarget.set(a.x, 2, a.z); cam.gR = Math.min(cam.gR, 38); }
      }
    },
    relabel: function (names) { buildPins(names); },
    trace: startTrace,
    highlight: function (ids) {
      hl.clear(); (ids || []).forEach((i) => hl.add(i));
      Object.keys(units).forEach((k) => { if (units[k].pin) units[k].pin.classList.toggle('dim', hl.size > 0 && !hl.has(k)); });
    },
    setInset: function (dx, dy) { cam.gix = dx || 0; cam.giy = dy || 0; },
    stopTrace: function () { stopTrace(); },
    isTracing: function () { return tr.on; },

  <script type="text/plain" id="src-app">
/* app.js — glue between the 3D city, the unit panel, the tracers, the report and the radio lab. */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const byId = {}; window.UNITS.forEach((u) => { byId[u.id] = u; });
  const pick = (o) => I18N.iso(I18N.pick(o));
  let current = null, tracing = false, traceKind = 'net', traceIdx = -1, layerId = null;

  const names = (id) => I18N.iso(I18N.pick(byId[id].name).replace(/\s*\(.*\)\s*$/, ''));
  const traceData = () => (traceKind === 'power' ? window.TRACE_POWER : window.TRACE);

  function buildChips() {
    const nav = $('chips'); nav.textContent = '';
    window.UNITS.forEach((u) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.unit = u.id;
      if (u.layer === 'power') b.classList.add('pw');
      b.textContent = names(u.id); b.addEventListener('click', () => openUnit(u.id));

  }

  function updateInset() {

  }

  // ---- calculator ----
  function renderCalc(u) {
    const wrap = $('pCalcWrap'), box = $('pCalc'); box.textContent = '';

    const title = document.createElement('p'); title.className = 'calc-title'; title.textContent = pick(u.calc.title); box.appendChild(title);
    const vals = {}, outs = [];
    function recompute() { outs.forEach((o) => { o.el.textContent = o.def.fn(vals); }); }

      const row = document.createElement('label'); row.className = 'crow';
      const name = document.createElement('span'); name.textContent = pick(inp.label);

      row.append(name, val, r); box.appendChild(row);
    });
    const res = document.createElement('div'); res.className = 'cres';
    u.calc.outs.forEach((o) => {
      const cell = document.createElement('div'); const l = document.createElement('span'); l.textContent = pick(o.label);
      const v = document.createElement('strong'); cell.append(l, v); res.appendChild(cell); outs.push({ def: o, el: v });
    });
    box.appendChild(res);
    if (u.calc.note) { const n = document.createElement('p'); n.className = 'fine'; n.textContent = pick(u.calc.note); box.appendChild(n); }
    recompute();
  }

  function renderPanel() {
    if (!current) return;
    const u = byId[current];
    $('pCat').textContent = pick(u.cat); $('pName').textContent = pick(u.name); $('pDesc').textContent = pick(u.desc);
    $('pAnimCap').textContent = pick(u.anim);
    const dl = $('pSpecs'); dl.textContent = '';
    u.specs.forEach((s) => { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = pick(s.k); dd.textContent = pick(s.v); dl.append(dt, dd); });
    const ul = $('pModels'); ul.textContent = '';
    u.models.forEach((m) => { const li = document.createElement('li'); li.textContent = pick(m); ul.appendChild(li); });
    const fl = $('pFacts'); fl.textContent = ''; const facts = u.facts || [];
    $('pFactsWrap').hidden = !facts.length;
    facts.forEach((f) => { const li = document.createElement('li'); li.textContent = pick(f.text) + '  [' + f.src.join(', ') + ']'; fl.appendChild(li); });
    renderCalc(u);
    $('btnOpenRadio').hidden = !u.preset;
    $('panel').scrollTop = 0;
  }

  function openUnit(id, fromTrace) {
    if (!id) { closePanel(); return; }
    if (tracing && !fromTrace) stopTrace();
    current = id; $('panel').hidden = false; renderPanel(); updateInset();
    window.City.select(id, !fromTrace);
    window.UnitAnim.start($('pCanvas'), id);
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.unit === id));
    const act = document.querySelector('.chip[aria-pressed="true"]'); if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  function closePanel() {
    current = null; $('panel').hidden = true; window.UnitAnim.stop(); window.City.select(null); updateInset();
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));

  // ---- tracers ----
  function stopTrace() { tracing = false; traceIdx = -1; window.City.stopTrace(); $('traceBar').hidden = true; setTraceBtn(); }
  function setTraceBtn() {
    $('btnTrace').textContent = I18N.t(tracing && traceKind === 'net' ? 'traceStop' : 'trace'); $('btnTrace').setAttribute('aria-pressed', tracing && traceKind === 'net');
    $('btnTracePower').textContent = I18N.t(tracing && traceKind === 'power' ? 'traceStop' : 'tracePower'); $('btnTracePower').setAttribute('aria-pressed', tracing && traceKind === 'power');
  }

  }

  // ---- layer highlight ----
  function showLayer(id) {
    const l = window.REPORT.layers.find((x) => x.id === id); if (!l) return;
    layerId = id; window.City.highlight(l.units); $('layerName').textContent = I18N.t('layerShown') + ': ' + I18N.iso(I18N.pick(l.name)); $('layerBar').hidden = false;
  }
  function clearLayer() { layerId = null; window.City.highlight([]); $('layerBar').hidden = true; }

  // ---- report modal ----
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function renderReport() {
    const R = window.REPORT, root = $('report'); root.textContent = '';

    const head = el('header', 'report-head'); const h = el('h2', null, pick(R.title)); h.id = 'repTitle';
    const close = el('button', 'report-close', I18N.t('close')); close.type = 'button'; close.addEventListener('click', closeReport); head.append(h, close);
    const body = el('div', 'report-body'); body.appendChild(el('p', 'lead', pick(R.intro)));

    body.appendChild(el('h3', null, I18N.t('layersT')));
    R.layers.forEach((l) => {
      const card = el('div', 'rlayer'); card.append(el('strong', null, pick(l.name)), el('p', null, pick(l.text)));
      const row = el('div', 'rrow'); l.units.forEach((u) => row.appendChild(el('span', 'tag', names(u))));
      const go = el('button', null, I18N.t('showInCity')); go.type = 'button'; go.addEventListener('click', () => { closeReport(); if (tracing) stopTrace(); showLayer(l.id); });
      card.append(row, go); body.appendChild(card);
    });
    body.appendChild(el('h3', null, I18N.t('factsT')));
    const fu = el('ul', 'facts'); R.facts.forEach((f) => { const li = el('li', null, pick(f.text) + '  [' + f.src.join(', ') + ']'); li.appendChild(el('small', null, ' — ' + pick(f.note))); fu.appendChild(li); }); body.appendChild(fu);
    body.appendChild(el('h3', null, I18N.t('actorsT')));
    const au = el('ul'); R.actors.forEach((a) => { const li = el('li'); li.append(el('strong', null, pick(a.name)), document.createTextNode(': ' + pick(a.text))); au.appendChild(li); }); body.appendChild(au);
    body.appendChild(el('h3', null, I18N.t('kpisT')));
    const ku = el('ul'); R.kpis.forEach((k) => ku.appendChild(el('li', null, pick(k)))); body.appendChild(ku);
    body.appendChild(el('h3', null, I18N.t('sourcesT')));
    const su = el('ol', 'srcs');
    R.sources.forEach((s) => { const li = el('li'); li.value = s.n; const a = el('a', null, pick(s.t)); a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; li.appendChild(a); su.appendChild(li); });
    body.appendChild(su); body.appendChild(el('p', 'fine', pick(R.limits)));

  }
  let repOpener = null;
  function openReport() { repOpener = document.activeElement; renderReport(); $('report').hidden = false; document.body.classList.add('lab-open'); $('report').querySelector('.report-close').focus(); }
  function closeReport() { $('report').hidden = true; document.body.classList.remove('lab-open'); if (repOpener && repOpener.focus) repOpener.focus(); }

  function relabelAll() {
    buildChips(); window.City.relabel(names); renderPanel(); setTraceBtn(); renderTrace(); updateInset();
    $('btnLang').textContent = I18N.t('lang'); if (window.Lab) window.Lab.relabel();
    if (!$('report').hidden) renderReport();
    if (layerId) showLayer(layerId);
    if (current) window.UnitAnim.start($('pCanvas'), current);
  }

  function start() {
    let saved = null; try { saved = localStorage.getItem('mokhaberat.lang'); } catch (e) { /* ignore */ }
    I18N.set(saved === 'en' || saved === 'fa' ? saved : 'fa');
    if (!window.THREE) { $('loading').textContent = I18N.t('noGL'); $('loading').classList.add('err'); return; }
    try {
      window.City.init({
        canvas: $('stage'), labels: $('labels'), names: names,
        onPick: (id) => openUnit(id),
        onTraceStep: (i, unit, total, kind) => { traceKind = kind; traceIdx = i; $('traceBar').hidden = false; renderTrace(); openUnit(unit, true); },
        onTraceEnd: () => { stopTrace(); }
      });
    } catch (e) { console.error(e); $('loading').textContent = I18N.t('noGL'); $('loading').classList.add('err'); return; }
    buildChips(); setTraceBtn(); $('btnLang').textContent = I18N.t('lang');
    $('loading').hidden = true;

    $('btnLang').addEventListener('click', () => I18N.set(I18N.lang === 'fa' ? 'en' : 'fa'));
    $('btnTrace').addEventListener('click', () => toggleTrace('net'));
    $('btnTracePower').addEventListener('click', () => toggleTrace('power'));
    $('btnReport').addEventListener('click', openReport);
    $('btnRadio').addEventListener('click', () => window.Lab.open());
    $('btnOpenRadio').addEventListener('click', () => { const u = byId[current]; window.Lab.open(u && u.preset); });
    $('pClose').addEventListener('click', () => { if (tracing) stopTrace(); closePanel(); });
    $('traceStop').addEventListener('click', stopTrace);
    $('layerClear').addEventListener('click', clearLayer);

    });

})();

  <script>
/* loader.js — loads Three.js without ever leaving the page stuck on "loading".
 * Order: local copy (js/vendor/three.min.js) → jsDelivr → cdnjs → unpkg, each with a timeout.
 * Then city.js and app.js are loaded. If everything fails, a clear message is shown. */
(function () {
  'use strict';
  const SOURCES = [
    'three.min.js', 'js/vendor/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  const box = () => document.getElementById('loading');
  function say(t, err) { const b = box(); if (b) { b.textContent = t; b.classList.toggle('err', !!err); } }
  function load(src, ms) {
    return new Promise(function (res, rej) {
      const s = document.createElement('script'); let done = false;
      const t = setTimeout(function () { if (!done) { done = true; rej(new Error('timeout')); } }, ms);
      s.onload = function () { if (!done) { done = true; clearTimeout(t); res(); } };
      s.onerror = function () { if (!done) { done = true; clearTimeout(t); rej(new Error('error')); } };
      s.src = src; document.head.appendChild(s);
    });
  }
  function runInline(id) { var s = document.createElement('script'); s.text = document.getElementById(id).textContent; document.head.appendChild(s); }
  async function getThree() {
    for (const src of SOURCES) {
      if (window.THREE) return true;
      say(I18N.t('loading') + '  (' + (src.indexOf('http') === 0 ? new URL(src).hostname : 'local') + ')');
      try { await load(src, src.indexOf('http') === 0 ? 7000 : 3000); } catch (e) { /* try next source */ }
    }
    return !!window.THREE;
  }
  getThree().then(function (ok) {
    if (!ok) { say(I18N.t('noGL'), true); return; }
    say(I18N.t('loading'));
    runInline('src-city'); runInline('src-app');
  }).catch(function (e) { console.error(e); say(I18N.t('noGL'), true); });
})();
