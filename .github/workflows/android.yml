name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'mp/**'
      - 'native/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install icon tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Build APK
        run: bash native/build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: didehban-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
